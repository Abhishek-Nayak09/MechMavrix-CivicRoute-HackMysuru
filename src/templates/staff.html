<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        CivicRoute Staff Dashboard
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='styles.css') }}"
    >

    <style>

        .staff-page {
            width: min(1400px, 95%);
            margin: 0 auto;
            padding: 32px 0 60px;
        }

        .staff-heading {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 26px;
        }

        .staff-heading h2 {
            color: #17345f;
            font-size: 30px;
            margin-bottom: 5px;
        }

        .staff-heading p {
            color: #667085;
        }

        .staff-badge {
            background: #e8f0ff;
            color: #17345f;
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 800;
        }

        .stats-grid {
            display: grid;
            grid-template-columns:
                repeat(5, minmax(0, 1fr));
            gap: 14px;
            margin-bottom: 26px;
        }

        .stat-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 18px;
        }

        .stat-label {
            display: block;
            color: #667085;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 5px;
        }

        .stat-value {
            color: #17345f;
            font-size: 28px;
            font-weight: 800;
        }

        .dashboard-toolbar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 18px;
            background: white;
            padding: 15px;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
        }

        .dashboard-toolbar select,
        .dashboard-toolbar input {
            min-height: 44px;
            border: 1px solid #d0d5dd;
            border-radius: 9px;
            padding: 9px 12px;
            font-size: 14px;
            background: white;
        }

        .dashboard-toolbar input {
            flex: 1;
            min-width: 220px;
        }

        .refresh-button {
            min-height: 44px;
            padding: 9px 18px;
            border: none;
            border-radius: 9px;
            background: #17345f;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }

        .complaint-list {
            display: grid;
            gap: 18px;
        }

        .staff-complaint-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            overflow: hidden;
        }

        .complaint-card-top {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            padding: 17px 20px;
            border-bottom: 1px solid #e9edf3;
            background: #fbfcfe;
            flex-wrap: wrap;
        }

        .complaint-number {
            color: #17345f;
            font-weight: 800;
            font-size: 16px;
        }

        .complaint-time {
            color: #667085;
            font-size: 13px;
        }

        .status-pill,
        .priority-pill {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 800;
            margin-left: 6px;
        }

        .status-pill {
            background: #edf3fb;
            color: #17345f;
        }

        .priority-pill {
            background: #fff3d6;
            color: #8a5200;
        }

        .complaint-card-body {
            display: grid;
            grid-template-columns:
                220px 1fr;
            gap: 20px;
            padding: 20px;
        }

        .staff-photo {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 12px;
            background: #101828;
        }

        .complaint-details {
            display: grid;
            grid-template-columns:
                repeat(3, minmax(0, 1fr));
            gap: 12px;
        }

        .detail-box {
            border: 1px solid #e3e8ef;
            border-radius: 10px;
            padding: 12px;
            background: #fafcff;
            min-width: 0;
        }

        .detail-box span {
            display: block;
            color: #667085;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.45px;
            margin-bottom: 3px;
        }

        .detail-box strong {
            display: block;
            color: #17345f;
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        .complaint-address {
            grid-column: 1 / -1;
        }

        .complaint-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            padding: 0 20px 20px;
        }

        .action-button {
            border: 1px solid #cfd8e5;
            border-radius: 8px;
            background: white;
            min-height: 40px;
            padding: 8px 13px;
            font-weight: 700;
            color: #17345f;
            cursor: pointer;
        }

        .action-button.primary {
            background: #17345f;
            color: white;
            border-color: #17345f;
        }

        .empty-state {
            background: white;
            border: 1px dashed #cbd5e1;
            border-radius: 14px;
            padding: 40px 20px;
            text-align: center;
            color: #667085;
        }

        .loading-state {
            text-align: center;
            padding: 35px;
            color: #667085;
        }

        @media (max-width: 1000px) {

            .stats-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .complaint-card-body {
                grid-template-columns: 1fr;
            }

            .staff-photo {
                max-width: 420px;
            }
        }

        @media (max-width: 700px) {

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .complaint-details {
                grid-template-columns: 1fr;
            }

            .staff-page {
                width: 94%;
            }
        }

    </style>
</head>


<body>

    <header class="topbar">

        <div class="brand">

            <h1>
                MechMavrix CivicRoute
            </h1>

            <p>
                Civic Staff Operations Dashboard
            </p>

        </div>

    </header>


    <main class="staff-page">


        <section class="staff-heading">

            <div>

                <span class="staff-badge">
                    AUTHORITY VIEW
                </span>

                <h2>
                    Civic Complaint Dashboard
                </h2>

                <p>
                    Prioritised complaints routed to civic staff.
                </p>

            </div>

        </section>



        <!-- ==================================================
             DASHBOARD STATS
        =================================================== -->

        <section class="stats-grid">

            <div class="stat-card">

                <span class="stat-label">
                    Total Complaints
                </span>

                <span
                    class="stat-value"
                    id="statTotal"
                >
                    0
                </span>

            </div>


            <div class="stat-card">

                <span class="stat-label">
                    New
                </span>

                <span
                    class="stat-value"
                    id="statNew"
                >
                    0
                </span>

            </div>


            <div class="stat-card">

                <span class="stat-label">
                    Assigned
                </span>

                <span
                    class="stat-value"
                    id="statAssigned"
                >
                    0
                </span>

            </div>


            <div class="stat-card">

                <span class="stat-label">
                    In Progress
                </span>

                <span
                    class="stat-value"
                    id="statProgress"
                >
                    0
                </span>

            </div>


            <div class="stat-card">

                <span class="stat-label">
                    Resolved
                </span>

                <span
                    class="stat-value"
                    id="statResolved"
                >
                    0
                </span>

            </div>

        </section>



        <!-- ==================================================
             FILTERS
        =================================================== -->

        <section class="dashboard-toolbar">

            <select id="statusFilter">

                <option value="">
                    All Statuses
                </option>

                <option value="NEW">
                    New
                </option>

                <option value="ASSIGNED">
                    Assigned
                </option>

                <option value="IN PROGRESS">
                    In Progress
                </option>

                <option value="REVIEW REQUIRED">
                    Review Required
                </option>

                <option value="RESOLVED">
                    Resolved
                </option>

            </select>


            <input
                id="searchInput"
                type="search"
                placeholder="Search complaint ID, issue, authority or department..."
            >


            <button
                class="refresh-button"
                id="refreshButton"
                type="button"
            >
                Refresh
            </button>

        </section>



        <!-- ==================================================
             COMPLAINTS
        =================================================== -->

        <section
            id="complaintList"
            class="complaint-list"
        >

            <div class="loading-state">

                Loading routed complaints...

            </div>

        </section>


    </main>


    <script
        src="{{ url_for('static', filename='staff.js') }}"
    ></script>

</body>

</html>
